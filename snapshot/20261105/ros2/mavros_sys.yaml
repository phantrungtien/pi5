/mavros/sys:
  ros__parameters:
    conn_timeout: 10.0
    disable_diag: false
    heartbeat_mav_type: ONBOARD_CONTROLLER
    heartbeat_rate: 1.0
    min_voltage:
    - 10.0
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    use_sim_time: false

